<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver View - Fast GPS Music Player</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    .app-container { width: 100%; max-width: 400px; height: 100vh; max-height: 820px; background: linear-gradient(180deg, #2b1f3d 0%, #121212 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 24px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; }
    .top-bar p { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #b3b3b3; font-weight: 600; }
    .album-card { width: 100%; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; margin: 20px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .album-card img { width: 100%; height: 100%; object-fit: cover; }
    .track-details { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .track-info h2 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .track-info p { font-size: 13px; color: #b3b3b3; }
    .gps-status { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.08); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #b3b3b3; }
    .status-dot { width: 8px; height: 8px; background-color: #ff4d4d; border-radius: 50%; transition: background-color 0.3s; }
    .status-dot.active { background-color: #1db954; box-shadow: 0 0 8px #1db954; }
    .status-dot.warning { background-color: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
    .controls { display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px; }
    .play-pause-btn { width: 72px; height: 72px; background-color: #1db954; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4); }
    .play-icon, .pause-icon { fill: #000; width: 28px; height: 28px; }
    .pause-icon { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <p>Driver Dashboard</p>
    </div>

    <audio id="audioPlayer" src="tera_naam_aaya.mp3" preload="auto"></audio>

    <div class="album-card">
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80" alt="Album Cover">
    </div>

    <div class="track-details">
      <div class="track-info">
        <h2>Tera Naam Aaya</h2>
        <p id="artistText">Tap Play to Start Trip</p>
      </div>
      <div class="gps-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusLabel">OFFLINE</span>
      </div>
    </div>

    <div class="controls">
      <button class="play-pause-btn" id="toggleBtn" onclick="toggleTrip()">
        <svg class="play-icon" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause-icon" id="pauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const TOPIC = "school_system_bus_tracking_demo_9921";
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    let isPlaying = false;
    let watchId = null;
    let lastCoords = null;
    let lastAddress = "Fetching location...";
    const audio = document.getElementById("audioPlayer");

    function toggleTrip() {
      if (!isPlaying) {
        startTrip();
      } else {
        stopTrip();
      }
    }

    function startTrip() {
      audio.play().then(() => {
        isPlaying = true;
        document.getElementById("playIcon").style.display = "none";
        document.getElementById("pauseIcon").style.display = "block";
        setGpsStatus("warning", "LOCATING...");

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            sendLocation(pos);
            publishEvent("START_TRIP");
          }, handleGpsError, { enableHighAccuracy: true, timeout: 3000, maximumAge: 10000 });

          watchId = navigator.geolocation.watchPosition(sendLocation, handleGpsError, {
            enableHighAccuracy: true, timeout: 4000, maximumAge: 1000
          });
        }
      }).catch(err => alert("Audio play error: Ensure tera_naam_aaya.mp3 is in the folder."));
    }

    function stopTrip() {
      audio.pause();
      isPlaying = false;
      document.getElementById("playIcon").style.display = "block";
      document.getElementById("pauseIcon").style.display = "none";
      setGpsStatus("offline", "OFFLINE");

      publishEvent("STOP_TRIP");

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    }

    async function sendLocation(position) {
      setGpsStatus("active", "LIVE GPS");
      document.getElementById("artistText").innerText = "Playing • Route Active";

      lastCoords = { latitude: position.coords.latitude, longitude: position.coords.longitude };
      
      // Send continuous GPS ping
      client.publish(TOPIC, JSON.stringify({
        type: "GPS_PING",
        ...lastCoords,
        timestamp: Date.now()
      }));

      // Fetch Address asynchronously
      lastAddress = await getAddress(lastCoords.latitude, lastCoords.longitude);
    }

    function publishEvent(eventType) {
      client.publish(TOPIC, JSON.stringify({
        type: "DRIVER_CLICK",
        action: eventType,
        latitude: lastCoords ? lastCoords.latitude : null,
        longitude: lastCoords ? lastCoords.longitude : null,
        address: lastAddress,
        timestamp: Date.now()
      }));
    }

    async function getAddress(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        return data.display_name || "Unknown Location";
      } catch {
        return `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
      }
    }

    function handleGpsError(error) {
      setGpsStatus("warning", "GPS TIMEOUT");
    }

    function setGpsStatus(type, text) {
      const dot = document.getElementById("statusDot");
      dot.className = "status-dot " + (type === "active" ? "active" : type === "warning" ? "warning" : "");
      document.getElementById("statusLabel").innerText = text;
    }
  </script>
</body>
</html>
